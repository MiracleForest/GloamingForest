# Adapted from LiteLDev/Levitate v0.1.0 (.github/workflows/build.yml), LGPL-3.0-or-later.
name: Build

on:
  pull_request:
    # 'edited': the ownership check reruns after a title fix (rule R25)
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # CI runners build one target per job: no machine-wide throttle needed there.
  GF_NO_THROTTLE: '1'

jobs:
  build:
    # a title or description edit changes no file: only the ownership job below reruns
    if: github.event.action != 'edited'
    strategy:
      fail-fast: false
      matrix:
        # One job per supported LeviLamina line and target type; the lip variant has the line's
        # name (lip.toml). The checks that depend on neither run once, in the job with 'checks'.
        include:
          - variant: "26_51"
            levilamina: 26.51.7
            target_type: server
            checks: true
          - variant: "26_51"
            levilamina: 26.51.7
            target_type: client
            checks: false
    name: build (${{ matrix.target_type }}, LeviLamina ${{ matrix.levilamina }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the mod version comes from the latest tag; the ownership check needs the base

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.variant }}-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'locks/*.lock') }}
          restore-keys: |
            xmake-${{ matrix.variant }}-${{ matrix.target_type }}-

      # The action's release lookup fails intermittently on the runners; retry once before failing.
      - name: Setup LLVM
        id: llvm
        continue-on-error: true
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: Setup LLVM (retry)
        if: steps.llvm.outcome == 'failure'
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - run: xmake repo -u

      - name: Build
        shell: pwsh
        run: pwsh tools/build.ps1 -Target ${{ matrix.target_type }} -LeviLamina ${{ matrix.levilamina }}

      - name: Dump xmake package install logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/.xmake/cache/packages" -Recurse -Filter install.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "::group::$($_.FullName)"; Get-Content $_.FullName -Tail 400; Write-Host '::endgroup::' }

      - name: Unit tests
        if: matrix.checks
        run: |
          xmake build -P . -y gf-tests
          xmake run -P . gf-tests

      - name: Assemble checks
        if: matrix.checks
        shell: pwsh
        run: pwsh tools/assemble.ps1 -Check

      # The shared TF checkout the tool checks read (tools/tf/fetch.ps1: git with a blob-less
      # partial clone of the pinned commit, never the GitHub API; no .ogg / .nbt), cached per commit.
      - uses: actions/cache@v6
        if: matrix.checks
        with:
          path: ~/AppData/Local/gf-tf
          key: gf-tf-9e40a75721c716b2fdf80c16d1058fe718825e9f-${{ hashFiles('tools/tf/fetch.ps1') }}

      - name: TF checkout
        if: matrix.checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/tf/fetch.ps1
          if ($LASTEXITCODE) { exit 1 }

      - name: Tool checks (owners, import, synth, models, template)
        if: matrix.checks
        shell: pwsh
        run: |
          # every check runs; the step fails at the end when any of them failed
          $checks = @(
            @('tools/spec/owners.ps1', '-Check'),       # docs/spec/owners.tsv is generated from TF and the rules
            @('tools/import/run.ps1', '-Check'),        # F1: the committed import reproduces byte for byte
            @('tools/sounds/synth.ps1', '-Check'),      # F3: the committed audio renders from its recipes
            @('tools/models/test.ps1', '-SkipTree'),    # F2: the converter's PowerShell / C# tests
            @('tools/models/convert.ps1', '-Check'),    # F2: the committed geometry reproduces
            @('tools/structures/build.ps1', '-Check'))  # F7: templates against TF's template definitions
          # F11's family generator and its checks (integer states, permutation budget, geometry) run
          # inside the 'Assemble checks' step above: assemble -Check runs tools/families/run.lua on the
          # assembled packs (a second run on the same directory would be a no-op).
          $failed = @()
          foreach ($c in $checks) {
            Write-Host "::group::pwsh $($c -join ' ')"
            pwsh -NoProfile -File @c
            $rc = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($rc) { Write-Host "::error::$($c -join ' ') failed (exit $rc)"; $failed += $c[0] }
          }
          if ($failed) { exit 1 }

      # A7's asset lints on the packs 'Assemble checks' wrote (build/assemble-check). The runner has
      # no game: the import lint checks vanilla texture paths against the file list of Mojang's
      # bedrock-samples resource pack (the tree only, no blobs; written as a vanilla/contents.json as the
      # game has it). That list lacks some sound files the game ships (basalt_deltas clicks, ...), so the
      # sound lint leaves vanilla sound names unverified there (it checks them against a real game locally).
      - name: Asset lints (import, sounds)
        if: matrix.checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.26.50.4'   # bedrock-samples release of the game version the mod targets (1.26.5x)
          $vanilla = Join-Path $env:RUNNER_TEMP 'bedrock-vanilla'
          # the resource_pack subtree only (the recursive listing of the whole repository is larger)
          $rp = gh api "repos/Mojang/bedrock-samples/contents/?ref=$tag" --jq '.[] | select(.name == "resource_pack") | .sha'
          $tree = gh api "repos/Mojang/bedrock-samples/git/trees/$($rp)?recursive=1" | ConvertFrom-Json
          if (-not $tree -or $tree.truncated) { Write-Host '::error::could not list bedrock-samples/resource_pack'; exit 1 }
          $paths = @($tree.tree | Where-Object { $_.type -eq 'blob' } | ForEach-Object { $_.path })
          New-Item -ItemType Directory -Force (Join-Path $vanilla 'vanilla') | Out-Null
          @{ content = @($paths | ForEach-Object { @{ path = $_ } }) } | ConvertTo-Json -Depth 4 -Compress |
            Set-Content (Join-Path $vanilla 'vanilla/contents.json')
          Write-Host "bedrock-samples $tag : $($paths.Count) resource pack files"
          $failed = @()
          foreach ($c in @(@('tools/import/lint.ps1', '-Vanilla', $vanilla), @('tools/sounds/lint.ps1'))) {
            Write-Host "::group::pwsh $($c -join ' ')"
            pwsh -NoProfile -File @c
            $rc = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($rc) { Write-Host "::error::$($c -join ' ') failed (exit $rc)"; $failed += $c[0] }
          }
          if ($failed) { exit 1 }

      - name: ARR guard
        if: matrix.checks
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Every blob of every commit since the base, not only the head tree: a TF .ogg/.nbt added
          # in one commit and deleted in a later one would otherwise reach the public history (R10/R11).
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $range = "origin/$env:BASE_REF" }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') { $range = $env:BEFORE_SHA } # the previous main
          else { $range = '0' } # manual run: the whole history of HEAD
          pwsh tools/ci/arr-guard.ps1 -CommittedOnly -Range $range
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-win-x64-ll${{ matrix.variant }}
          path: |
            bin/${{ matrix.target_type }}/GloamingForest/

  ownership:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge base with the target branch

      - name: Ownership
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # PR titles are "U<n>: ..." / "F<n>: ..." / "A<n>: ..." (rule R25)
          if ($env:PR_TITLE -notmatch '^([UFA]\d+):') { Write-Host "PR title must start with U<n>:/F<n>:/A<n>: (R25), got '$env:PR_TITLE'"; exit 1 }
          pwsh tools/ci/ownership.ps1 -Unit $Matches[1] -Base "origin/$env:BASE_REF"
          if ($LASTEXITCODE) { exit 1 }