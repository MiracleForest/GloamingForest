# Adapted from LiteLDev/Levitate v0.1.0 (.github/workflows/release.yml), LGPL-3.0-or-later.
# Runs only for a pushed version tag (v<major>.<minor>.<patch>[-<pre-release>]); tags are created by
# hand by the maintainers, never by automation.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GF_NO_THROTTLE: '1'
  GF_NO_TEST_PACKS: '1' # releases ship without the gf_test fixture packs

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # One job per supported LeviLamina line and target type; the lip variant has the line's
        # name (lip.toml), the ZIP the line's number.
        include:
          - variant: "26_51"
            levilamina: 26.51.7
            line: "26.51"
            target_type: server
            checks: true
          - variant: "26_51"
            levilamina: 26.51.7
            line: "26.51"
            target_type: client
            checks: false
    name: build (${{ matrix.target_type }}, LeviLamina ${{ matrix.levilamina }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the mod version comes from the latest tag

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.variant }}-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'locks/*.lock') }}
          restore-keys: |
            xmake-${{ matrix.variant }}-${{ matrix.target_type }}-

      - name: Setup LLVM
        id: llvm
        continue-on-error: true
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: Setup LLVM (retry)
        if: steps.llvm.outcome == 'failure'
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - run: xmake repo -u

      - name: Build
        shell: pwsh
        run: pwsh tools/build.ps1 -Target ${{ matrix.target_type }} -LeviLamina ${{ matrix.levilamina }}

      - name: Unit tests
        if: matrix.checks
        run: |
          xmake build -P . -y gf-tests
          xmake run -P . gf-tests

      - name: Check version
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}".TrimStart('v')
          $actual = (Get-Content bin/${{ matrix.target_type }}/GloamingForest/manifest.json | ConvertFrom-Json).version
          if ($actual -ne $expected) { throw "manifest version $actual does not match tag $expected" }
          $declared = (Select-String -Path lip.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($declared -ne $expected) { throw "lip.toml version $declared does not match tag $expected" }

      - name: Package
        shell: pwsh
        run: |
          $dir = "bin/${{ matrix.target_type }}/GloamingForest"
          Copy-Item COPYING, COPYING.LESSER, NOTICE, README.md -Destination $dir
          Copy-Item assets/LICENSE (Join-Path $dir 'ASSETS_LICENSE')
          # lip's mcmod asset wants manifest.json at the root of the ZIP, with '/' separators.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $dir).Path,
            (Join-Path (Get-Location) "gloamingforest-${{ matrix.target_type }}-win-x64-ll${{ matrix.line }}.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

      - uses: actions/upload-artifact@v7
        with:
          name: zip-${{ matrix.target_type }}-${{ matrix.variant }}
          path: gloamingforest-${{ matrix.target_type }}-win-x64-ll${{ matrix.line }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: zip-*
          merge-multiple: true

      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[|^\[[^\]]+\]: ' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          ($body -join "`n").Trim() | Set-Content RELEASE_NOTES.md -Encoding utf8

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/gloamingforest-server-win-x64-ll26.51.zip
            dist/gloamingforest-client-win-x64-ll26.51.zip
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}