format = 4
id = "github.com/MiracleForest/GloamingForest"
version = "0.1.0"

[info]
name = "GloamingForest"
description = "The Gloaming Forest: a dimension of dark woods, landmarks and bosses for Minecraft Bedrock Edition"
tags = ["adventure", "world-generation", "dimension"]

# GloamingForest is compiled against one LeviLamina line at a time, so every supported line is a
# variant named after it: 26_51 for LeviLamina 26.51.x (Minecraft 1.26.51). Variant names may only
# hold [a-z0-9_], hence 26_51 and not 26.51. Each line has a server build (BDS) and a client build
# (LeviLauncher).
#
# The default variant is the newest supported line. There are no other variants: lip and
# LeviLauncher pick the server or client entry by the side they install to. LeviLamina releases
# are still tooth.json packages, whose client build is the variant "client", so the client entries
# depend on LeviLamina#client and the server entries on plain LeviLamina.
#
# A LeviLamina 26.51 server loads its mods from plugins/ (where lip puts LeviLamina itself), so the
# server builds are placed there; the client builds are lip mod archives, which go to mods/.

# --- 26.51 (Minecraft 1.26.51) ------------------------------------------------------------------

[[variants.""]]
side = "server"
platform = "win-x64"
preserve = ["plugins/GloamingForest/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.51.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/gloamingforest-server-win-x64-ll26.51.zip"]
place = [{ src = "", dest = "plugins/GloamingForest/" }]

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/GloamingForest/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/gloamingforest-client-win-x64-ll26.51.zip"]

[[variants."26_51"]]
side = "server"
platform = "win-x64"
preserve = ["plugins/GloamingForest/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina" = "26.51.*"

[[variants."26_51".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/gloamingforest-server-win-x64-ll26.51.zip"]
place = [{ src = "", dest = "plugins/GloamingForest/" }]

[[variants."26_51"]]
side = "client"
platform = "win-x64"
preserve = ["mods/GloamingForest/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."26_51".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/gloamingforest-client-win-x64-ll26.51.zip"]
